_base_: pads_multi_activity_v3_nested_cv.yaml

experiment:
  name: pads_pure_deep_split_sensor_v5
  output_root: outputs/pads_classification/pure_deep_split_sensor_v5
  seed: 42
  deterministic: true

model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  pure_deep:
    feature_dim: 64
    dropout: 0.1
    pooling: attention_mean_std
    stem_mode: split_acc_gyro
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2

loss:
  label_smoothing: 0.0
  class_weights: train_balanced

training:
  mixed_precision: false

development:
  hypothesis: >-
    Accelerometer and gyroscope channels describe complementary dynamics in
    different physical units, so modality-specific shallow filters before joint
    temporal encoding should generalize better than immediate six-channel mixing.
  comparison: [PureDeepPool-balanced-v3, R1]
  stop_rule: >-
    Reject the split stem if BA gain versus balanced-v3 is below 0.01 or if
    BA, AUROC, macro-F1 and DD recall do not improve coherently across folds.
