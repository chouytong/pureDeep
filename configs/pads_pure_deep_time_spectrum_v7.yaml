_base_: pads_multi_activity_v3_nested_cv.yaml

experiment:
  name: pads_pure_deep_time_spectrum_v7
  output_root: outputs/pads_classification/pure_deep_time_spectrum_v7
  seed: 42
  deterministic: true

model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  pure_deep:
    feature_dim: 64
    dropout: 0.1
    pooling: attention_mean_std
    stem_mode: shared
    spectral:
      enabled: true
      feature_dim: 32
      frequency_bins: 256
      maximum_hz: 20.0
      dropout: 0.1
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2

loss:
  label_smoothing: 0.0
  class_weights: train_balanced

training:
  mixed_precision: false

development:
  hypothesis: >-
    The one-second effective receptive field of balanced-v3 under-represents
    full-activity periodicity. A differentiable global rFFT log-magnitude branch
    with learnable frequency convolutions should recover complementary information
    without handcrafted bands, peaks or energy features.
  comparison: [PureDeepPool-balanced-v3, R1]
  stop_rule: >-
    Reject the spectral branch if BA gain versus balanced-v3 is below 0.01 or if
    BA, AUROC, macro-F1 and DD recall do not improve coherently across folds.
