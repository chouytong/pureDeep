_base_: pads_multi_activity_v3_nested_cv.yaml

experiment:
  name: pads_pure_deep_pool_small_balanced_v3_seed43
  output_root: outputs/pads_classification/pure_deep_pool_small_balanced_v3_seed43
  seed: 43
  deterministic: true

model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  pure_deep:
    feature_dim: 64
    dropout: 0.1
    pooling: attention_mean_std
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2

loss:
  label_smoothing: 0.0
  class_weights: train_balanced

training:
  mixed_precision: false

development:
  hypothesis: >-
    If balanced-v3 learns a stable representation rather than benefiting from a
    favorable initialization, its improvement over R1 should persist with seed 43.
  comparison: [R1, PureDeepPool-balanced-v3-seed42]
  stop_rule: >-
    Do not retain balanced-v3 as a stable candidate if the seed-level mean BA
    regresses to R1 or the fold pattern reverses substantially.
