    hard_gating_train_only: false
    attention_type: tanh
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2
    mode: attention
  pure_deep:
    encoder_mode: resnet1d
    feature_dim: 64
    dropout: 0.1
    moment_branch:
      enabled: false
    gyro_frequency_branch:
      enabled: false
    resnet1d:
      stage_channels:
      - 32
      - 64
      - 64
      blocks_per_stage:
      - 2
      - 2
      - 2
      stem_kernel_size: 15
      kernel_size: 7
      normalization_groups: 8
  bilateral_fusion:
    mode: full
