development:
  hypothesis: A 64-D bilateral mean may retain the shared disease signal while removing
    redundant left/right/difference dimensions that increased representation shift.
  comparison: pads_pure_deep_groupnorm_nr01_seed42
  single_factor: full_258d_bilateral_fusion_to_mean_only_64d
  stop_rule: Retain as a simplified candidate only if three-seed mean BA, AUROC, and
    Macro-F1 are each within 0.005 of frozen V8-GN, neither class recall falls by
    more than 0.02, at least 7 of 15 seed-aggregated matched splits improve in BA,
    BA seed SD does not increase by more than 0.005, parameters decrease by at least
    15 percent, and representation shift is not coherently worse.
