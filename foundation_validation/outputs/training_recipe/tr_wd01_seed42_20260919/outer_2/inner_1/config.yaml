model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  frequency:
    bands:
    - - 0.5
      - 3.0
    - - 3.0
      - 7.0
    - - 7.0
      - 12.0
    boundary: half_open
    include_last_high: true
    include_original: false
  encoder:
    branch_channels: 64
    hidden_dim: 128
    kernel_size: 3
    dilations:
