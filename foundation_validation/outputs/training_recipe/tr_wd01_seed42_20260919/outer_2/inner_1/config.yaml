    dropout: 0.1
    pooling: attention_mean_std
    stem_mode: shared
    temporal:
      kernel_size: 7
      dilations:
      - 1
      - 2
      - 4
      normalization: group_norm
      normalization_groups: 8
    spectral:
      enabled: false
    moment_branch:
      enabled: true
      feature_dim: 32
      kernels:
      - 1
      - 15
      - 63
