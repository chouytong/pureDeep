    TouchNose: /home/zyt/MFAM/data/processed/pads_multi_activity/v2_l1_full_length/manifests/TouchNose.csv

model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  pure_deep:
    encoder_mode: inception_time
    feature_dim: 64
    dropout: 0.1
    moment_branch: {enabled: false}
    gyro_frequency_branch: {enabled: false}
    inception_time:
      bottleneck_channels: 32
      branch_channels: 32
      kernel_sizes: [39, 19, 9]
      residual_stack_count: 2
      modules_per_stack: 3
      normalization_groups: 8
  bilateral_fusion: {mode: full}
  activity_fusion:
    mode: attention
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2

loss: {label_smoothing: 0.0, class_weights: train_balanced}
training: {mixed_precision: false}

development:
  hypothesis: Same as strong_inception_time_seed42 under seed 44.
  comparison: V8-GN same-seed fixed inner-development folds
  stop_rule: Same preregistered three-seed replacement rule as seed 42.
