development:
  hypothesis: Preserving the fixed ordered structure of all 11 pre-aggregation bilateral
    activity representations until the decision stage may recover discriminative cross-activity
    structure lost by the single subject embedding.
  comparison: pads_pure_deep_groupnorm_nr01_seed44
  stop_rule: Retain only if BA improves by at least 0.01, AUROC by at least 0.015,
    Macro-F1 does not decrease, neither class recall is materially sacrificed, about
    10 of 15 matched splits improve, and seed stability does not worsen.
  phase3c_variant: adapt
  train_fraction_percent: 100
