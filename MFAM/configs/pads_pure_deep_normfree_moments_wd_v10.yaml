_base_: pads_multi_activity_v3_nested_cv.yaml

experiment:
  name: pads_pure_deep_normfree_moments_wd_v10
  output_root: outputs/pads_classification/pure_deep_normfree_moments_wd_v10
  seed: 42
  deterministic: true

model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  pure_deep:
    feature_dim: 64
    dropout: 0.1
    pooling: attention_mean_std
    stem_mode: shared
    spectral:
      enabled: false
    moment_branch:
      enabled: true
      feature_dim: 32
      kernels: [1, 15, 63]
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2

loss:
  label_smoothing: 0.0
  class_weights: train_balanced

training:
  mixed_precision: false
  weight_decay: 1.0e-3

development:
  hypothesis: >-
    V8's learned-moment branch improves representation but still overfits and is
    seed-sensitive. Increasing AdamW weight decay from 1e-4 to 1e-3 should reduce
    fold/seed variance without changing architecture or information access.
  comparison: pure_deep_normfree_moments_v8_seed42
  stop_rule: >-
    Retain only if BA improves by at least 0.01 or is within 0.005 while fold
    standard deviation, NLL and Brier all improve. Otherwise keep v8 settings and
    stop weight-decay tuning rather than searching a validation grid.
