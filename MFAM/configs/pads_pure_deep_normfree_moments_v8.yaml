_base_: pads_multi_activity_v3_nested_cv.yaml

experiment:
  name: pads_pure_deep_normfree_moments_v8
  output_root: outputs/pads_classification/pure_deep_normfree_moments_v8
  seed: 42
  deterministic: true

model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  pure_deep:
    feature_dim: 64
    dropout: 0.1
    pooling: attention_mean_std
    stem_mode: shared
    spectral:
      enabled: false
    moment_branch:
      enabled: true
      feature_dim: 32
      kernels: [1, 15, 63]
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2

loss:
  label_smoothing: 0.0
  class_weights: train_balanced

training:
  mixed_precision: false

development:
  hypothesis: >-
    The BatchNorm-heavy temporal encoder under-retains between-subject amplitude
    and distribution cues that explain much of H1's advantage. A small
    normalization-free learnable convolution bank followed only by mean/std
    pooling of its learned feature maps will improve stable inner-CV performance.
  comparison: pure_deep_pool_small_balanced_v3_seed42
  stop_rule: >-
    Retain only if mean balanced accuracy improves by at least 0.01, improves in
    at least 9 of 15 matched folds, and AUROC and calibration do not materially
    regress. Otherwise reject this branch and stop moment-branch expansion.
