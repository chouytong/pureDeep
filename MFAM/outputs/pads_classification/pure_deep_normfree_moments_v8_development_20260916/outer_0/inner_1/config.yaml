model:
  name: pure_deep_subject
  input_channels: 6
  num_classes: 2
  sample_rate: 100.0
  frequency:
    bands:
    - - 0.5
      - 3.0
    - - 3.0
      - 7.0
    - - 7.0
      - 12.0
    boundary: half_open
    include_last_high: true
    include_original: false
  encoder:
    branch_channels: 64
    hidden_dim: 128
    kernel_size: 3
    dilations:
    - 1
    - 2
    - 4
    channel_reduction: 8
    conv_bias: false
    dropout: 0.0
  mil:
    window_seconds: 1.0
    overlap: 0.5
    attention_dim: null
    retention_ratio: 0.3
    epsilon: 1.0e-08
    hard_gating: true
    hard_gating_train_only: false
    attention_type: tanh
  activity_fusion:
    attention_dim: 64
    dropout: 0.1
    classifier_dropout: 0.2
  pure_deep:
    feature_dim: 64
    dropout: 0.1
    pooling: attention_mean_std
    stem_mode: shared
    spectral:
      enabled: false
    moment_branch:
      enabled: true
      feature_dim: 32
      kernels:
      - 1
      - 15
      - 63
