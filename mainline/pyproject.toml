[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pads-wearable-classification"
version = "1.0.0"
description = "Subject-level PADS wearable-sensor classification pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Research-only project; PADS data license applies" }
authors = [{ name = "PADS classification contributors" }]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
